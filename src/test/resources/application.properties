spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.dataloader.enabled=false

# Valores dummy para satisfacer @Value() en clients durante tests
equipment.service.url=http://localhost:8081
trainer.service.url=http://localhost:8085

# Requerido por OpenApiConfig (@Value) pero sin depender de Keycloak en tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/gimnasio

# Evita inicializar JwtDecoder via issuer-uri (OIDC discovery) durante tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
