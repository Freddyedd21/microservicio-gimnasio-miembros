spring.application.name=miembros-service
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:miembrosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==================== KEYCLOAK / OAuth2 Security ====================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/gimnasio
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/gimnasio/protocol/openid-connect/certs

# ==================== SWAGGER / OPENAPI ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method

# ==================== RABBITMQ ====================
app.rabbitmq.enabled=true
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=gimnasio
spring.rabbitmq.password=gimnasio123

# URL del servicio de equipos
equipment.service.url=http://localhost:8081

# URL del servicio de entrenadores
trainer.service.url=http://localhost:8085
